<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도감 점검</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; background: #f4f1ea; color: #222; }
  iframe { border: 1px solid #999; background: #000; vertical-align: top; margin: 0 8px 8px 0; }
  pre { white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>
<p>모든 쪽을 두 판형(펼침·한 쪽)으로 펼쳐 보며 오류, 넘친 쪽, 깨진 링크와 그림, 넘김 동작을 점검한다.
  <code>uv run tools/serve.py</code> 로 띄운 뒤 <code>http://localhost:8000/tools/check.html</code> 로 연다.</p>
<iframe id="wide" width="1280" height="860"></iframe>
<iframe id="narrow" width="390" height="844"></iframe>
<pre id="out">점검 중…</pre>
<script type="module">
const out = [];
const log = s => { out.push(s); document.getElementById("out").textContent = out.join("\n"); };
addEventListener("error", e => log("harness error: " + e.message));
addEventListener("unhandledrejection", e => log("harness rejection: " + (e.reason?.stack || e.reason)));
const wait = ms => new Promise(r => setTimeout(r, ms));
async function boot(frame) {
  const errs = [];
  frame.src = "../index.html?test";
  await new Promise(r => frame.onload = r);
  const w = frame.contentWindow;
  w.addEventListener("error", e => { errs.push(`${e.message} @${e.filename}:${e.lineno}`); log("  오류: " + e.message + " @" + e.lineno); });
  w.addEventListener("unhandledrejection", e => errs.push(`promise: ${e.reason}`));
  for (let i = 0; i < 100 && !(w.__book && w.document.body.classList.contains("ready")); i++) await wait(50);
  return { w, errs };
}
async function imgsDone(doc) {
  const imgs = [...doc.querySelectorAll(".book .slot:not(.probe) img")];
  await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  return imgs.filter(i => !i.naturalWidth).map(i => i.getAttribute("src"));
}
async function sweep(name, frame) {
  const { w, errs } = await boot(frame);
  const B = w.__book, S = B.S, doc = w.document;
  log(`== ${name}: ${S.mode} ${S.W}×${S.H}, 쪽 ${S.pages.length}, 화면 ${S.views.length}, 목록 한 쪽 ${S.cap.list}줄, 찾아보기 ${S.cap.index}줄`);
  const keys = new Set(S.pages.map(p => p.key));
  let overflow = 0, badLinks = 0, badImgs = 0, turnFail = 0;
  for (let n = 0; n < S.views.length; n++) {
    await B.ensure(S.views[n]);
    B.showView(n);
    for (const pg of doc.querySelectorAll(".book .slot:not(.probe) .page")) {
      const inn = pg.querySelector(".pg-in");
      if (inn && inn.scrollHeight > inn.clientHeight + 2) {
        overflow++;
        log(`  넘침: ${pg.dataset.key} (+${inn.scrollHeight - inn.clientHeight}px)`);
      }
      const fill = pg.querySelector(".fill");
      if (fill && fill.scrollHeight > fill.clientHeight + 2) { overflow++; log(`  목록 넘침: ${pg.dataset.key} (${fill.scrollHeight} > ${fill.clientHeight}, 줄 ${fill.children.length}, 줄높이 ${fill.firstElementChild?.getBoundingClientRect().height.toFixed(2)}, 간격 ${getComputedStyle(fill).rowGap})`); }
      for (const a of pg.querySelectorAll('a[href^="#/"]')) {
        const key = decodeURIComponent(a.getAttribute("href")).replace(/^#\/[^/]*\/?/, "");
        if (!keys.has(key)) { badLinks++; log(`  깨진 링크: ${pg.dataset.key} → ${key}`); }
      }
      for (const t of pg.querySelectorAll(".pg-in *")) {
        if (/TODO/.test(t.childNodes[0]?.nodeValue || "")) { log(`  TODO 글자 노출: ${pg.dataset.key}`); break; }
      }
    }
    const broken = await imgsDone(doc);
    badImgs += broken.length;
    broken.forEach(b => log(`  그림 없음: ${b}`));
  }
  // 넘김: 앞으로 여러 장, 뒤로, 멀리 뛰기, 표지로 돌아가기
  B.showView(0);
  const seq = [1, 2, 3, 4, 3, Math.min(S.views.length - 1, 12), 13, 14, 15, 16, 17, 18, 17, 2, 0, S.views.length - 1];
  for (const n of seq) {
    log(`  넘김 → ${n}`);
    await B.turnTo({ delta: n - S.view });
    for (let i = 0; i < 60 && S.busy; i++) await wait(50);
    if (S.view !== n) { turnFail++; log(`  넘김 실패: ${n} 로 가지 않음(현재 ${S.view})`); }
    if (doc.querySelector(".leaf")) { turnFail++; log(`  넘김 뒤 남은 장: ${n}`); }
  }
  // 손으로 끌기 흉내: 오른쪽 쪽 아래 모서리에서 왼쪽으로
  B.showView(Math.min(5, S.views.length - 2));
  const before = S.view, r = doc.getElementById("book").getBoundingClientRect();
  const x0 = r.right - 20, y0 = r.bottom - 20;
  const ev = (type, x, y) => new w.PointerEvent(type, { pointerId: 7, pointerType: "touch", isPrimary: true, button: 0, buttons: 1, clientX: x, clientY: y, bubbles: true });
  doc.getElementById("book").dispatchEvent(ev("pointerdown", x0, y0));
  for (let k = 1; k <= 12; k++) { w.dispatchEvent(ev("pointermove", x0 - k * (r.width * 0.07), y0 - k * 2)); await wait(16); }
  w.dispatchEvent(ev("pointerup", x0 - r.width * 0.84, y0 - 24));
  for (let i = 0; i < 40 && S.busy; i++) await wait(50);
  if (S.view !== before + 1) { turnFail++; log(`  끌어 넘기기 실패 (${before} → ${S.view})`); }
  if (doc.querySelector(".leaf")) { turnFail++; log("  끌기 뒤 남은 장"); }
  log(`  쪽 ${S.pages.length} · 화면 ${S.views.length} · 넘친 쪽 ${overflow} · 깨진 링크 ${badLinks} · 빠진 그림 ${badImgs} · 넘김 실패 ${turnFail} · 스크립트 오류 ${errs.length}`);
  errs.forEach(e => log("  오류: " + e));
  return overflow + badLinks + badImgs + turnFail + errs.length;
}
const bad = (await sweep("넓은 화면", document.getElementById("wide"))) + (await sweep("좁은 화면", document.getElementById("narrow")));
log(bad ? `RESULT FAIL (${bad})` : "RESULT OK");
document.getElementById("out").textContent = out.join("\n");
</script>
</body>
</html>
